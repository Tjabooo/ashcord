[package]
name = "ashcord"
version = "0.1.0"
edition = "2024"
description = "Vencord-style plugins for Discord, built for the native Rust client (Phoenix) and working with today's client too"
license = "MIT"
repository = "https://github.com/Tjabooo/ashcord"
readme = "README.md"
keywords = ["discord", "vencord", "client-mod", "proxy", "phoenix"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lru = "0.16"
notify-rust = "4"
rcgen = { version = "0.14", features = ["x509-parser"] }
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"
zstd = "0.13"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
